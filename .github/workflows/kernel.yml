name: oneplus13 内核编译

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '配置档：stable=当前默认 / minimal=关掉所有可选特性（二分定位） / custom=改 configs/profiles/custom.env'
        required: true
        type: choice
        default: 'stable'
        options:
          - 'stable'
          - 'minimal'
          - 'custom'
      ksu_type:
        description: 'KernelSU类型'
        required: true
        type: choice
        default: 'ksu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      afdo_mode:
        description: 'AutoFDO 模式：off=关闭 / use=使用已有采样 / generate=生成可采样内核'
        required: true
        type: choice
        default: 'use'
        options:
          - 'off'
          - 'use'
          - 'generate'
      ccache_mode:
        description: 'ccache：keep=保留 / reset=先清缓存 / debug=保留并上传调试日志'
        required: true
        type: choice
        default: 'keep'
        options:
          - 'keep'
          - 'reset'
          - 'debug'
      kernel_suffix:
        description: '内核后缀'
        required: false
        type: string
        default: ''
      diagnosis:
        description: '诊断模式：同步源码+打补丁+注入配置后导出 config，不编译不打包'
        required: true
        type: boolean
        default: false
      clean_build:
        description: '强制干净构建'
        required: true
        type: boolean
        default: false

# 同一工作流的构建串行排队，避免两次派发争用同一台 self-hosted 编译机
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 180
    permissions:
      # 构建不向仓库回写任何内容（同步源码走公开 HTTPS 读），
      # actions: write 只用于 gh cache delete 与 artifact 上传
      actions: write
      contents: read
    env:
      LOG_FILE: ${{ github.workspace }}/build_summary.log
      PROFILE_NAME: ${{ inputs.profile }}
      KSU_TYPE: ${{ inputs.ksu_type }}
      AFDO_MODE: ${{ inputs.afdo_mode }}
      AFDO_ENABLE: ${{ inputs.afdo_mode != 'off' }}
      AFDO_GENERATE: ${{ inputs.afdo_mode == 'generate' }}
      CCACHE_DEBUG_INPUT: ${{ inputs.ccache_mode == 'debug' }}
      KERNEL_SUFFIX_INPUT: ${{ inputs.kernel_suffix }}
      DIAGNOSIS: ${{ inputs.diagnosis }}
      CLEAN_BUILD: ${{ inputs.clean_build }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 同步仓库代码
        run: |
          cd "$GITHUB_WORKSPACE"
          git init -q 2>/dev/null || true
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for i in 1 2 3; do
            git -c http.version=HTTP/1.1 fetch origin "$GITHUB_REF_NAME" --depth=1 2>/dev/null && break
            echo "[WARN] 仓库拉取第 $i 次失败，5 秒后重试"
            sleep 5
          done
          git reset --hard FETCH_HEAD
          git clean -fdq -e kernel_workspace

      # 特性开关（SUSFS/LZ4KD/ADIOS/BORE…）不进派发表单，统一放 configs/profiles/<name>.env，
      # 这样「这个内核是什么」跟着 commit 走，派发时只需要选「这次要做什么」
      - name: 载入配置档
        run: |
          set -euo pipefail
          PROFILE_FILE="configs/profiles/${PROFILE_NAME}.env"
          if [ ! -f "$PROFILE_FILE" ]; then
            echo "::error::找不到配置档 $PROFILE_FILE"
            exit 1
          fi
          echo "[INFO] 载入配置档: $PROFILE_NAME ($PROFILE_FILE)"
          grep -vE '^[[:space:]]*(#|$)' "$PROFILE_FILE" | while IFS='=' read -r KEY VAL; do
            KEY="${KEY//[[:space:]]/}"
            VAL="${VAL//[[:space:]]/}"
            echo "$KEY=$VAL" >> "$GITHUB_ENV"
            echo "  $KEY=$VAL"
          done

      - name: 代码静态检查
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/lint.sh
      - name: 环境初始化
        id: init_env
        run: bash "$GITHUB_WORKSPACE/scripts/init_env.sh"

      - name: ccache 配置
        run: bash "$GITHUB_WORKSPACE/scripts/ccache_setup.sh"

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_mode == 'reset'
        run: |
          if gh cache delete "${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}" -R "${{ github.repository }}"; then
            echo "[INFO] 旧 ccache 缓存删除成功"
          else
            echo "[INFO] 旧 ccache 缓存清理跳过"
          fi

      - name: 应用补丁
        run: bash "$GITHUB_WORKSPACE/scripts/apply_patches.sh"

      - name: 注入配置
        run: bash "$GITHUB_WORKSPACE/scripts/config_inject.sh"


      - name: 准备 AutoFDO profile
        run: |
          AFDO_DIR="$HOME/.cache_patches/afdo"
          mkdir -p "$AFDO_DIR"
          MODE="${AFDO_MODE:-off}"
          case "$MODE" in
            use)
              # 优先用自采样本；没有则回退到内核源码树自带的 Google GKI profile
              PROFILE_SRC=""
              if [ -s "$AFDO_DIR/kernel.afdo" ]; then
                PROFILE_SRC="$AFDO_DIR/kernel.afdo"
                echo "[INFO] AutoFDO 使用自采样本" | tee -a "$LOG_FILE"
              else
                IN_TREE="$GITHUB_WORKSPACE/kernel_workspace/common/android/gki/aarch64/afdo/kernel.afdo"
                if [ -s "$IN_TREE" ]; then
                  PROFILE_SRC="$IN_TREE"
                  echo "[INFO] AutoFDO 使用内核树自带的 GKI profile: $(du -h "$IN_TREE" | cut -f1)" | tee -a "$LOG_FILE"
                fi
              fi
              if [ -z "$PROFILE_SRC" ]; then
                echo "[ERROR] afdo_mode=use 但既无自采样本也无源码树 profile" | tee -a "$LOG_FILE"
                exit 1
              fi
              AFDO_HASH=$(md5sum "$PROFILE_SRC" | cut -c1-8)
              AFDO_LINK="$AFDO_DIR/kernel-$AFDO_HASH.afdo"
              rm -f "$AFDO_LINK"
              cp -f "$PROFILE_SRC" "$AFDO_LINK"   # 拷贝而非软链：构建期间 profile 内容必须不可变
              echo "AFDO_PROFILE=$AFDO_LINK" >> "$GITHUB_ENV"
              # profile 与 vmlinux 的符号表一致性校验（防止采样后内核又变过）
              META="$AFDO_DIR/kernel.afdo.meta"
              if [ -f "$META" ] && [ -f "$AFDO_DIR/vmlinux.latest" ]; then
                NM_BIN=""
                NM_BIN=$(ls "$HOME"/.toolchains/*/bin/llvm-nm 2>/dev/null | head -1)
                if [ -n "$NM_BIN" ]; then
                  M1=$(sed -n "s/^vmlinux_syms=//p" "$META")
                  M2=$("$NM_BIN" --defined-only "$AFDO_DIR/vmlinux.latest" 2>/dev/null | awk '$2 ~ /^[tT]$/ {print $1, $3}' | md5sum | cut -c1-16)
                  if [ -n "$M1" ] && [ "$M1" != "$M2" ]; then
                    echo "[ERROR] 自采 profile 与当前 vmlinux 符号表不一致（采样后内核已变过）" | tee -a "$LOG_FILE"
                    echo "        处理：在对应 generate 内核上重新采样，或删除 kernel.afdo* 后改用源码树 GKI profile" | tee -a "$LOG_FILE"
                    exit 1
                  fi
                  echo "[INFO] profile 与 vmlinux 符号表一致（$M1）" | tee -a "$LOG_FILE"
                fi
              fi
              # 把对应的 vmlinux 也传下去，供构建期做 profile 新鲜度校验
              if [ -f "$AFDO_DIR/vmlinux.latest" ]; then
                echo "AFDO_VMLINUX=$AFDO_DIR/vmlinux.latest" >> "$GITHUB_ENV"
              fi
              echo "[INFO] AutoFDO 使用已有采样: $AFDO_LINK (hash=$AFDO_HASH)" | tee -a "$LOG_FILE"
              ;;
            generate)
              echo "AFDO_PROFILE=" >> "$GITHUB_ENV"
              echo "[INFO] AutoFDO 生成模式：本次内核带 -fdebug-info-for-profiling，用于采集" | tee -a "$LOG_FILE"
              echo "[INFO] 设备采样（刷入本内核后执行，勿在 AFDO 内核上采样）：" | tee -a "$LOG_FILE"
              echo "[INFO]   simpleperf record -a -o /data/local/tmp/perf_data.data --duration 1800" | tee -a "$LOG_FILE"
              echo "[INFO]  采完把 perf.data 放到编译机: scripts/afdo_collect.sh perf.data ..." | tee -a "$LOG_FILE"
              echo "[INFO] 详见 docs/AUTOFDO.md" | tee -a "$LOG_FILE"
              ;;
            *)
              echo "AFDO_PROFILE=" >> "$GITHUB_ENV"
              echo "[INFO] AutoFDO 未启用" | tee -a "$LOG_FILE"
              ;;
          esac

      - name: 编译内核
        if: ${{ !inputs.diagnosis }}
        run: |
          set -o pipefail
          : > "$HOME/kbuild.log"
          bash "$GITHUB_WORKSPACE/scripts/build_kernel.sh" 2>&1 | tee -a "$HOME/kbuild.log"

      - name: 上传诊断配置文本
        if: inputs.diagnosis
        uses: actions/upload-artifact@v7
        with:
          name: kernel-config-${{ github.run_id }}
          if-no-files-found: warn
          path: kernel_workspace/common/out/build_config.txt

      - name: 汇总并打印构建日志
        if: always()
        run: |
          echo "=================================================="
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "[INFO] 暂无构建日志"
          fi
          echo "=================================================="

      - name: 打包发布
        if: ${{ !inputs.diagnosis }}
        id: create_zip
        run: bash "$GITHUB_WORKSPACE/scripts/package.sh"

      # 产物原本只存在 VM 磁盘上（保留 5 个历史包），VM 磁盘损坏即全部丢失；
      # 这里再上传一份到 GitHub，7 天后自动过期
      - name: 上传安装包
        if: ${{ !inputs.diagnosis }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: |
            ${{ github.workspace }}/kernel_workspace/${{ steps.create_zip.outputs.ak3name }}
            ${{ github.workspace }}/build_summary.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传 Ccache 调试日志
        if: ${{ always() && inputs.ccache_mode == 'debug' && !inputs.diagnosis }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
