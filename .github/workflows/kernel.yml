name: oneplus13 内核编译

on:
  workflow_dispatch:
    inputs:
      root:
        description: 'Root 方案：none=不集成 / ksu=KernelSU / resukisu=ReSukiSU / sukisu=SukiSU / ksunext=KernelSU-Next'
        required: true
        type: choice
        default: 'ksu'
        options:
          - 'none'
          - 'ksu'
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
      susfs:
        description: '隐藏：on=集成 SUSFS（sus_path/sus_mount/open_redirect 等全套，需 root≠none）/ off=不集成'
        required: true
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'
      kpm:
        description: 'KPM：off=不集成 / builtin=SukiSU、ReSukiSU 内置 KPM / kpn=构建后用 KP-N 修补 Image'
        required: true
        type: choice
        default: 'off'
        options:
          - 'off'
          - 'builtin'
          - 'kpn'
      sched:
        description: '调度器：stock=不改 / tuned=NEXT_BUDDY+HRTICK+SIS_PROP+CACHE_HOT_BUDDY+LB_MIN / tuned_bore=以上全部+BORE 调度器（开机接管）'
        required: true
        type: choice
        default: 'tuned'
        options:
          - 'stock'
          - 'tuned'
          - 'tuned_bore'
      io:
        description: '存储 IO：stock=不改 / adios=ADIOS I/O 调度器 / f2fs=ATGC+GC_MERGE+GC 三项调优 / adios_f2fs=两者都开'
        required: true
        type: choice
        default: 'adios_f2fs'
        options:
          - 'stock'
          - 'adios'
          - 'f2fs'
          - 'adios_f2fs'
      compression:
        description: '压缩：stock=内核自带 / lz4zstd=LZ4 1.10 NEON+zstd / lz4kd=LZ4KD（zram 多级压缩）/ lz4zstd_lz4kd=两者都开'
        required: true
        type: choice
        default: 'lz4zstd_lz4kd'
        options:
          - 'stock'
          - 'lz4zstd'
          - 'lz4kd'
          - 'lz4zstd_lz4kd'
      net:
        description: '网络：stock=不改 / bbr3=BBRv3 拥塞控制（含 tcp_bbr3 默认可用）'
        required: true
        type: choice
        default: 'bbr3'
        options:
          - 'stock'
          - 'bbr3'
      mem:
        description: '内存：stock=不改 / rcu_nocb=RCU_NOCB_CPU + RCU_LAZY（把回调卸载到专属线程）'
        required: true
        type: choice
        default: 'rcu_nocb'
        options:
          - 'stock'
          - 'rcu_nocb'
      container:
        description: '容器：off=不集成 / standard=命名空间+SysV IPC+ntsync / extend=再加 BT_HCIVHCI、STATIC_USERMODEHELPER 等'
        required: true
        type: choice
        default: 'off'
        options:
          - 'off'
          - 'standard'
          - 'extend'
      security:
        description: '安全：off=不集成 / baseband=基带保护 LSM / rekernel=Re-Kernel / both=两者都开'
        required: true
        type: choice
        default: 'off'
        options:
          - 'off'
          - 'baseband'
          - 'rekernel'
          - 'both'
      opt:
        description: '编译优化：stock=默认 / o3_polly=lib、crypto 加 -O3 + Polly 向量化'
        required: true
        type: choice
        default: 'o3_polly'
        options:
          - 'stock'
          - 'o3_polly'
      afdo:
        description: 'AutoFDO：off=关闭 / use=使用已有采样 / generate=生成可采样内核（采样后再用 use 重建）'
        required: true
        type: choice
        default: 'use'
        options:
          - 'off'
          - 'use'
          - 'generate'
      mode:
        description: '构建模式：build=增量编译 / clean=删 out 全量重建 / diagnosis=只跑源码同步+补丁+配置注入并导出 config（不编译不打包）'
        required: true
        type: choice
        default: 'build'
        options:
          - 'build'
          - 'clean'
          - 'diagnosis'
      ccache:
        description: 'ccache：keep=保留缓存 / reset=先删旧缓存 / debug=保留并上传调试日志'
        required: true
        type: choice
        default: 'keep'
        options:
          - 'keep'
          - 'reset'
          - 'debug'
      suffix:
        description: '内核后缀（留空用 build.env 默认值）'
        required: false
        type: string
        default: ''

# 同一工作流的构建串行排队，避免两次派发争用同一台 self-hosted 编译机
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 180
    permissions:
      # 构建不向仓库回写任何内容（同步源码走公开 HTTPS 读），
      # actions: write 只用于 gh cache delete 与 artifact 上传
      actions: write
      contents: read
    env:
      LOG_FILE: ${{ github.workspace }}/build_summary.log
      ROOT: ${{ inputs.root }}
      SUSFS: ${{ inputs.susfs }}
      KPM: ${{ inputs.kpm }}
      SCHED: ${{ inputs.sched }}
      IO: ${{ inputs.io }}
      COMPRESSION: ${{ inputs.compression }}
      NET: ${{ inputs.net }}
      MEM: ${{ inputs.mem }}
      CONTAINER: ${{ inputs.container }}
      SECURITY: ${{ inputs.security }}
      OPT: ${{ inputs.opt }}
      AFDO_MODE: ${{ inputs.afdo }}
      AFDO_ENABLE: ${{ inputs.afdo != 'off' }}
      AFDO_GENERATE: ${{ inputs.afdo == 'generate' }}
      BUILD_MODE: ${{ inputs.mode }}
      CCACHE_MODE: ${{ inputs.ccache }}
      CCACHE_DEBUG_INPUT: ${{ inputs.ccache == 'debug' }}
      KERNEL_SUFFIX_INPUT: ${{ inputs.suffix }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 同步仓库代码
        run: |
          cd "$GITHUB_WORKSPACE"
          git init -q 2>/dev/null || true
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for i in 1 2 3; do
            git -c http.version=HTTP/1.1 fetch origin "$GITHUB_REF_NAME" --depth=1 2>/dev/null && break
            echo "[WARN] 仓库拉取第 $i 次失败，5 秒后重试"
            sleep 5
          done
          git reset --hard FETCH_HEAD
          git clean -fdq -e kernel_workspace

      # 分类开关 -> 脚本实际读取的 *_ENABLE 变量。
      # 每个大类只做一个选择，展开结果会逐行打印在日志里，便于核对本次到底开了什么。
      - name: 展开分类开关
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; echo "  $1=$2"; }
          die() { echo "::error::$1"; exit 1; }

          case "$ROOT" in
            none)     emit KSU_TYPE none ;;
            ksu)      emit KSU_TYPE ksu ;;
            resukisu) emit KSU_TYPE resukisu ;;
            sukisu)   emit KSU_TYPE sukisu ;;
            ksunext)  emit KSU_TYPE ksunext ;;
            *) die "未知 root: $ROOT" ;;
          esac

          case "$SUSFS" in
            on)  emit SUSFS_ENABLE true ;;
            off) emit SUSFS_ENABLE false ;;
            *) die "未知 susfs: $SUSFS" ;;
          esac

          case "$KPM" in
            off)     emit KPM_ENABLE false ;;
            builtin) emit KPM_ENABLE builtin ;;
            kpn)     emit KPM_ENABLE kpn ;;
            *) die "未知 kpm: $KPM" ;;
          esac

          emit SCHED_ENABLE false
          emit BORE_ENABLE false
          case "$SCHED" in
            stock)      : ;;
            tuned)      emit SCHED_ENABLE true ;;
            tuned_bore) emit SCHED_ENABLE true; emit BORE_ENABLE true ;;
            *) die "未知 sched: $SCHED" ;;
          esac

          emit ADIOS_ENABLE false
          emit F2FS_ENABLE false
          case "$IO" in
            stock)      : ;;
            adios)      emit ADIOS_ENABLE true ;;
            f2fs)       emit F2FS_ENABLE true ;;
            adios_f2fs) emit ADIOS_ENABLE true; emit F2FS_ENABLE true ;;
            *) die "未知 io: $IO" ;;
          esac

          emit LZ4ZSTD_ENABLE false
          emit LZ4KD_ENABLE false
          case "$COMPRESSION" in
            stock)          : ;;
            lz4zstd)        emit LZ4ZSTD_ENABLE true ;;
            lz4kd)          emit LZ4KD_ENABLE true ;;
            lz4zstd_lz4kd)  emit LZ4ZSTD_ENABLE true; emit LZ4KD_ENABLE true ;;
            *) die "未知 compression: $COMPRESSION" ;;
          esac

          emit BBR3_ENABLE false
          case "$NET" in
            stock) : ;;
            bbr3)  emit BBR3_ENABLE true ;;
            *) die "未知 net: $NET" ;;
          esac

          emit RCU_NOCB_ENABLE false
          case "$MEM" in
            stock)    : ;;
            rcu_nocb) emit RCU_NOCB_ENABLE true ;;
            *) die "未知 mem: $MEM" ;;
          esac

          case "$CONTAINER" in
            off)      emit DROIDSPACES_ENABLE false ;;
            standard) emit DROIDSPACES_ENABLE standard ;;
            extend)   emit DROIDSPACES_ENABLE extend ;;
            *) die "未知 container: $CONTAINER" ;;
          esac

          emit BASEBAND_GUARD false
          emit REKERNEL_ENABLE false
          case "$SECURITY" in
            off)      : ;;
            baseband) emit BASEBAND_GUARD true ;;
            rekernel) emit REKERNEL_ENABLE true ;;
            both)     emit BASEBAND_GUARD true; emit REKERNEL_ENABLE true ;;
            *) die "未知 security: $SECURITY" ;;
          esac

          emit O3_SELECTIVE false
          case "$OPT" in
            stock)    : ;;
            o3_polly) emit O3_SELECTIVE true ;;
            *) die "未知 opt: $OPT" ;;
          esac

          emit CLEAN_BUILD false
          emit DIAGNOSIS false
          case "$BUILD_MODE" in
            build)     : ;;
            clean)     emit CLEAN_BUILD true ;;
            diagnosis) emit DIAGNOSIS true ;;
            *) die "未知 mode: $BUILD_MODE" ;;
          esac

          echo "[INFO] 分类开关展开完成"

      - name: 代码静态检查
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/lint.sh
      - name: 环境初始化
        id: init_env
        run: bash "$GITHUB_WORKSPACE/scripts/init_env.sh"

      - name: ccache 配置
        run: bash "$GITHUB_WORKSPACE/scripts/ccache_setup.sh"

      - name: 清除旧 ccache 缓存
        if: inputs.ccache == 'reset'
        run: |
          if gh cache delete "${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}" -R "${{ github.repository }}"; then
            echo "[INFO] 旧 ccache 缓存删除成功"
          else
            echo "[INFO] 旧 ccache 缓存清理跳过"
          fi

      - name: 应用补丁
        run: bash "$GITHUB_WORKSPACE/scripts/apply_patches.sh"

      - name: 注入配置
        run: bash "$GITHUB_WORKSPACE/scripts/config_inject.sh"


      - name: 准备 AutoFDO profile
        run: |
          AFDO_DIR="$HOME/.cache_patches/afdo"
          mkdir -p "$AFDO_DIR"
          MODE="${AFDO_MODE:-off}"
          case "$MODE" in
            use)
              # 优先用自采样本；没有则回退到内核源码树自带的 Google GKI profile
              PROFILE_SRC=""
              if [ -s "$AFDO_DIR/kernel.afdo" ]; then
                PROFILE_SRC="$AFDO_DIR/kernel.afdo"
                echo "[INFO] AutoFDO 使用自采样本" | tee -a "$LOG_FILE"
              else
                IN_TREE="$GITHUB_WORKSPACE/kernel_workspace/common/android/gki/aarch64/afdo/kernel.afdo"
                if [ -s "$IN_TREE" ]; then
                  PROFILE_SRC="$IN_TREE"
                  echo "[INFO] AutoFDO 使用内核树自带的 GKI profile: $(du -h "$IN_TREE" | cut -f1)" | tee -a "$LOG_FILE"
                fi
              fi
              if [ -z "$PROFILE_SRC" ]; then
                echo "[ERROR] afdo_mode=use 但既无自采样本也无源码树 profile" | tee -a "$LOG_FILE"
                exit 1
              fi
              AFDO_HASH=$(md5sum "$PROFILE_SRC" | cut -c1-8)
              AFDO_LINK="$AFDO_DIR/kernel-$AFDO_HASH.afdo"
              rm -f "$AFDO_LINK"
              cp -f "$PROFILE_SRC" "$AFDO_LINK"   # 拷贝而非软链：构建期间 profile 内容必须不可变
              echo "AFDO_PROFILE=$AFDO_LINK" >> "$GITHUB_ENV"
              # profile 与 vmlinux 的符号表一致性校验（防止采样后内核又变过）
              META="$AFDO_DIR/kernel.afdo.meta"
              if [ -f "$META" ] && [ -f "$AFDO_DIR/vmlinux.latest" ]; then
                NM_BIN=""
                NM_BIN=$(ls "$HOME"/.toolchains/*/bin/llvm-nm 2>/dev/null | head -1)
                if [ -n "$NM_BIN" ]; then
                  M1=$(sed -n "s/^vmlinux_syms=//p" "$META")
                  M2=$("$NM_BIN" --defined-only "$AFDO_DIR/vmlinux.latest" 2>/dev/null | awk '$2 ~ /^[tT]$/ {print $1, $3}' | md5sum | cut -c1-16)
                  if [ -n "$M1" ] && [ "$M1" != "$M2" ]; then
                    echo "[ERROR] 自采 profile 与当前 vmlinux 符号表不一致（采样后内核已变过）" | tee -a "$LOG_FILE"
                    echo "        处理：在对应 generate 内核上重新采样，或删除 kernel.afdo* 后改用源码树 GKI profile" | tee -a "$LOG_FILE"
                    exit 1
                  fi
                  echo "[INFO] profile 与 vmlinux 符号表一致（$M1）" | tee -a "$LOG_FILE"
                fi
              fi
              # 把对应的 vmlinux 也传下去，供构建期做 profile 新鲜度校验
              if [ -f "$AFDO_DIR/vmlinux.latest" ]; then
                echo "AFDO_VMLINUX=$AFDO_DIR/vmlinux.latest" >> "$GITHUB_ENV"
              fi
              echo "[INFO] AutoFDO 使用已有采样: $AFDO_LINK (hash=$AFDO_HASH)" | tee -a "$LOG_FILE"
              ;;
            generate)
              echo "AFDO_PROFILE=" >> "$GITHUB_ENV"
              echo "[INFO] AutoFDO 生成模式：本次内核带 -fdebug-info-for-profiling，用于采集" | tee -a "$LOG_FILE"
              echo "[INFO] 设备采样（刷入本内核后执行，勿在 AFDO 内核上采样）：" | tee -a "$LOG_FILE"
              echo "[INFO]   simpleperf record -a -o /data/local/tmp/perf_data.data --duration 1800" | tee -a "$LOG_FILE"
              echo "[INFO]   采完把 perf.data 放到编译机: scripts/afdo_collect.sh perf.data ..." | tee -a "$LOG_FILE"
              echo "[INFO] 详见 docs/AUTOFDO.md" | tee -a "$LOG_FILE"
              ;;
            *)
              echo "AFDO_PROFILE=" >> "$GITHUB_ENV"
              echo "[INFO] AutoFDO 未启用" | tee -a "$LOG_FILE"
              ;;
          esac

      - name: 编译内核
        if: ${{ inputs.mode != 'diagnosis' }}
        run: |
          set -o pipefail
          : > "$HOME/kbuild.log"
          bash "$GITHUB_WORKSPACE/scripts/build_kernel.sh" 2>&1 | tee -a "$HOME/kbuild.log"

      - name: 上传诊断配置文本
        if: inputs.mode == 'diagnosis'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-config-${{ github.run_id }}
          if-no-files-found: warn
          path: kernel_workspace/common/out/build_config.txt

      - name: 汇总并打印构建日志
        if: always()
        run: |
          echo "=================================================="
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "[INFO] 暂无构建日志"
          fi
          echo "=================================================="

      - name: 打包发布
        if: ${{ inputs.mode != 'diagnosis' }}
        id: create_zip
        run: bash "$GITHUB_WORKSPACE/scripts/package.sh"

      # 产物原本只存在 VM 磁盘上（保留 5 个历史包），VM 磁盘损坏即全部丢失；
      # 这里再上传一份到 GitHub，7 天后自动过期
      - name: 上传安装包
        if: ${{ inputs.mode != 'diagnosis' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: |
            ${{ github.workspace }}/kernel_workspace/${{ steps.create_zip.outputs.ak3name }}
            ${{ github.workspace }}/build_summary.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传 Ccache 调试日志
        if: ${{ always() && inputs.ccache == 'debug' && inputs.mode != 'diagnosis' }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
