name: oneplus13 内核编译

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: '编译机'
        required: true
        type: choice
        default: 'self-hosted'
        options:
          - 'self-hosted'
      clang_version:
        description: '编译器（19=稳定 ZyC19，21=ZyC21 实验）'
        required: true
        type: choice
        default: '19'
        options:
          - '19'
          - '21'
      ksu_type:
        description: 'KernelSU类型'
        required: true
        type: choice
        default: 'ksu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '集成susfs'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '集成kpm'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'builtin'
          - 'kpn'
      lz4kd_enable:
        description: '集成LZ4KD补丁'
        required: true
        type: boolean
        default: true
      droidspaces_enable:
        description: '集成Droidspaces容器支持'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      rekernel_enable:
        description: 'Re-Kernel支持'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: '基带保护'
        required: true
        type: boolean
        default: false
      adios_enable:
        description: '集成ADIOS I/O调度器'
        required: true
        type: boolean
        default: true
      nvhe_enable:
        description: 'KVM NVHE AutoFDO兼容'
        required: true
        type: boolean
        default: true
      bbr3_enable:
        description: '集成BBRv3'
        required: true
        type: boolean
        default: true
      sched_enable:
        description: '调度器优化'
        required: true
        type: boolean
        default: true
      lz4zstd_enable:
        description: '集成lz4/zstd'
        required: true
        type: boolean
        default: true
      f2fs_enable:
        description: 'f2fs优化'
        required: true
        type: boolean
        default: true
      bore_enable:
        description: 'BORE 调度器（实验，开机默认不接管）'
        required: false
        type: boolean
        default: false
      libbpf_enable:
        description: 'libbpf兼容修正'
        required: true
        type: boolean
        default: true
      rcu_nocb_enable:
        description: 'RCU_NOCB_CPU'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新ccache缓存'
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: '上传Ccache调试日志'
        required: true
        type: boolean
        default: false
      afdo_mode:
        description: 'AutoFDO 模式：off=关闭 / use=使用已有采样 / generate=生成可采样内核'
        required: true
        type: choice
        default: 'use'
        options:
          - 'off'
          - 'use'
          - 'generate'
      kernel_suffix:
        description: '内核后缀'
        required: false
        type: string
        default: ''
      diagnosis:
        description: '诊断模式：仅生成并导出config'
        required: true
        type: boolean
        default: false
      o3_selective:
        description: 'O3'
        required: true
        type: boolean
        default: true
      clean_build:
        description: '强制干净构建'
        required: true
        type: boolean
        default: false

# 同一工作流的构建串行排队，避免两次派发争用同一台 self-hosted 编译机
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner_type }}
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
    env:
      LOG_FILE: ${{ github.workspace }}/build_summary.log
      CLANG_VERSION: ${{ inputs.clang_version }}
      KSU_TYPE: ${{ inputs.ksu_type }}
      SUSFS_ENABLE: ${{ inputs.susfs_enable }}
      KPM_ENABLE: ${{ inputs.kpm_enable }}
      LZ4KD_ENABLE: ${{ inputs.lz4kd_enable }}
      DROIDSPACES_ENABLE: ${{ inputs.droidspaces_enable }}
      REKERNEL_ENABLE: ${{ inputs.rekernel_enable }}
      BASEBAND_GUARD: ${{ inputs.baseband_guard }}
      ADIOS_ENABLE: ${{ inputs.adios_enable }}
      NVHE_ENABLE: ${{ inputs.nvhe_enable }}
      BBR3_ENABLE: ${{ inputs.bbr3_enable }}
      SCHED_ENABLE: ${{ inputs.sched_enable }}
      LZ4ZSTD_ENABLE: ${{ inputs.lz4zstd_enable }}
      F2FS_ENABLE: ${{ inputs.f2fs_enable }}
      LIBBPF_ENABLE: ${{ inputs.libbpf_enable }}
      BORE_ENABLE: ${{ inputs.bore_enable }}
      RCU_NOCB_ENABLE: ${{ inputs.rcu_nocb_enable }}
      CCACHE_DEBUG_INPUT: ${{ inputs.ccache_debug }}
      KERNEL_SUFFIX_INPUT: ${{ inputs.kernel_suffix }}
      DIAGNOSIS: ${{ inputs.diagnosis }}
      O3_SELECTIVE: ${{ inputs.o3_selective }}
      CLEAN_BUILD: ${{ inputs.clean_build }}
      AFDO_MODE: ${{ inputs.afdo_mode }}
      AFDO_ENABLE: ${{ inputs.afdo_mode != 'off' }}
      AFDO_GENERATE: ${{ inputs.afdo_mode == 'generate' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 同步仓库代码
        run: |
          cd "$GITHUB_WORKSPACE"
          git init -q 2>/dev/null || true
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for i in 1 2 3; do
            git -c http.version=HTTP/1.1 fetch origin "$GITHUB_REF_NAME" --depth=1 2>/dev/null && break
            echo "[WARN] 仓库拉取第 $i 次失败，5 秒后重试"
            sleep 5
          done
          git reset --hard FETCH_HEAD
          git clean -fdq -e kernel_workspace

      - name: 代码静态检查
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/lint.sh
      - name: 环境初始化
        id: init_env
        run: bash "$GITHUB_WORKSPACE/scripts/init_env.sh"

      - name: ccache 配置
        run: bash "$GITHUB_WORKSPACE/scripts/ccache_setup.sh"

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        run: |
          if gh cache delete "${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}" -R "${{ github.repository }}"; then
            echo "[INFO] 旧 ccache 缓存删除成功"
          else
            echo "[INFO] 旧 ccache 缓存清理跳过"
          fi

      - name: 应用补丁
        run: bash "$GITHUB_WORKSPACE/scripts/apply_patches.sh"

      - name: 注入配置
        run: bash "$GITHUB_WORKSPACE/scripts/config_inject.sh"


      - name: 准备 AutoFDO profile
        run: |
          AFDO_DIR="$HOME/.cache_patches/afdo"
          mkdir -p "$AFDO_DIR"
          MODE="${AFDO_MODE:-off}"
          case "$MODE" in
            use)
              # 优先用自采样本；没有则回退到内核源码树自带的 Google GKI profile
              PROFILE_SRC=""
              if [ -s "$AFDO_DIR/kernel.afdo" ]; then
                PROFILE_SRC="$AFDO_DIR/kernel.afdo"
                echo "[INFO] AutoFDO 使用自采样本" | tee -a "$LOG_FILE"
              else
                IN_TREE="$GITHUB_WORKSPACE/kernel_workspace/common/android/gki/aarch64/afdo/kernel.afdo"
                if [ -s "$IN_TREE" ]; then
                  PROFILE_SRC="$IN_TREE"
                  echo "[INFO] AutoFDO 使用内核树自带的 GKI profile: $(du -h "$IN_TREE" | cut -f1)" | tee -a "$LOG_FILE"
                fi
              fi
              if [ -z "$PROFILE_SRC" ]; then
                echo "[ERROR] afdo_mode=use 但既无自采样本也无源码树 profile" | tee -a "$LOG_FILE"
                exit 1
              fi
              AFDO_HASH=$(md5sum "$PROFILE_SRC" | cut -c1-8)
              AFDO_LINK="$AFDO_DIR/kernel-$AFDO_HASH.afdo"
              rm -f "$AFDO_LINK"
              cp -f "$PROFILE_SRC" "$AFDO_LINK"   # 拷贝而非软链：构建期间 profile 内容必须不可变
              echo "AFDO_PROFILE=$AFDO_LINK" >> "$GITHUB_ENV"
              # profile 与 vmlinux 的符号表一致性校验（防止采样后内核又变过）
              META="$AFDO_DIR/kernel.afdo.meta"
              if [ -f "$META" ] && [ -f "$AFDO_DIR/vmlinux.latest" ]; then
                NM_BIN=""
                NM_BIN=$(ls "$HOME"/.toolchains/*/bin/llvm-nm 2>/dev/null | head -1)
                if [ -n "$NM_BIN" ]; then
                  M1=$(sed -n "s/^vmlinux_syms=//p" "$META")
                  M2=$("$NM_BIN" --defined-only "$AFDO_DIR/vmlinux.latest" 2>/dev/null | awk '$2 ~ /^[tT]$/ {print $1, $3}' | md5sum | cut -c1-16)
                  if [ -n "$M1" ] && [ "$M1" != "$M2" ]; then
                    echo "[ERROR] 自采 profile 与当前 vmlinux 符号表不一致（采样后内核已变过）" | tee -a "$LOG_FILE"
                    echo "        处理：在对应 generate 内核上重新采样，或删除 kernel.afdo* 后改用源码树 GKI profile" | tee -a "$LOG_FILE"
                    exit 1
                  fi
                  echo "[INFO] profile 与 vmlinux 符号表一致（$M1）" | tee -a "$LOG_FILE"
                fi
              fi
              # 把对应的 vmlinux 也传下去，供构建期做 profile 新鲜度校验
              if [ -f "$AFDO_DIR/vmlinux.latest" ]; then
                echo "AFDO_VMLINUX=$AFDO_DIR/vmlinux.latest" >> "$GITHUB_ENV"
              fi
              echo "[INFO] AutoFDO 使用已有采样: $AFDO_LINK (hash=$AFDO_HASH)" | tee -a "$LOG_FILE"
              ;;
            generate)
              echo "AFDO_PROFILE=" >> "$GITHUB_ENV"
              echo "[INFO] AutoFDO 生成模式：本次内核带 -fdebug-info-for-profiling，用于采集" | tee -a "$LOG_FILE"
              echo "[INFO] 设备采样（刷入本内核后执行，勿在 AFDO 内核上采样）：" | tee -a "$LOG_FILE"
              echo "[INFO]   simpleperf record -a -o /data/local/tmp/perf_data.data --duration 1800" | tee -a "$LOG_FILE"
              echo "[INFO] 采完把 perf.data 放到编译机: scripts/afdo_collect.sh perf.data ..." | tee -a "$LOG_FILE"
              echo "[INFO] 详见 docs/AUTOFDO.md" | tee -a "$LOG_FILE"
              ;;
            *)
              echo "AFDO_PROFILE=" >> "$GITHUB_ENV"
              echo "[INFO] AutoFDO 未启用" | tee -a "$LOG_FILE"
              ;;
          esac

      - name: 编译内核
        if: ${{ !inputs.diagnosis }}
        run: |
          set -o pipefail
          : > "$HOME/kbuild.log"
          bash "$GITHUB_WORKSPACE/scripts/build_kernel.sh" 2>&1 | tee -a "$HOME/kbuild.log"

      - name: 上传诊断配置文本
        if: inputs.diagnosis
        uses: actions/upload-artifact@v7
        with:
          name: kernel-config-${{ github.run_id }}
          if-no-files-found: warn
          path: kernel_workspace/common/out/build_config.txt

      - name: 汇总并打印构建日志
        if: always()
        run: |
          echo "=================================================="
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "[INFO] 暂无构建日志"
          fi
          echo "=================================================="

      - name: 打包发布
        if: ${{ !inputs.diagnosis }}
        id: create_zip
        run: bash "$GITHUB_WORKSPACE/scripts/package.sh"

      - name: 上传 Ccache 调试日志
        if: ${{ always() && inputs.ccache_debug && !inputs.diagnosis }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
