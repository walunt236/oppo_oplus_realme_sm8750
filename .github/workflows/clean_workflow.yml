name: 清理仓库工作流

on:
  workflow_dispatch:
    inputs:
      clean_mode:
        description: "清理模式(amount--保留数量, date--保留天数)："
        required: true
        type: choice
        default: 'amount'
        options:
          - 'amount'
          - 'date'
      clean_to_keep:
        description: "保留最近工作流的天数/数量："
        required: true
        type: string
        default: "0"

jobs:
  clean-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 安装GitHub CLI
        run: |
          sudo apt-mark hold firefox
          sudo apt-mark hold libc-bin
          sudo apt purge man-db
          sudo apt update
          sudo apt install -y jq
          type -p gh >/dev/null || sudo apt install -y gh
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
          gh --version

      - name: 按保留数量清理工作流
        if: ${{ github.event.inputs.clean_mode == 'amount' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo_full_name=$GITHUB_REPOSITORY
          keep_input="${{ github.event.inputs.clean_to_keep }}"
          if ! [[ "$keep_input" =~ ^[0-9]+$ ]]; then
            echo "::error::clean_to_keep 必须为非负整数，收到: $keep_input"
            exit 1
          fi
          # 获取所有工作流（--paginate 自动翻页，避免历史 run 超过 100 条时清理不到）
          all_workflows=$(gh api --paginate -X GET "repos/$repo_full_name/actions/runs?per_page=100" |
            jq -s --arg current_run "$GITHUB_RUN_ID" '[.[].workflow_runs[] | select(.id != ($current_run | tonumber))]')
          # 计算实际需要保留的工作流数量
          total_workflows=$(echo "$all_workflows" | jq length)
          keep_count=$(( keep_input < total_workflows ? keep_input : total_workflows ))
          # 获取要保留的最新工作流ID
          keep_ids=$(echo "$all_workflows" | 
            jq -r 'sort_by(.created_at) | reverse | .[0:'$keep_count'] | .[].id')
          echo "保留最近 $keep_count 个工作流 (ID: $keep_ids)"
          # 删除不在保留列表中的工作流
          echo "$all_workflows" | jq -r '.[] | select(.status != "in_progress" and .status != "queued") | .id' | while read id; do
            if ! grep -qw "$id" <<< "$keep_ids"; then
              echo "删除工作流 $id"
              gh api -X DELETE "repos/$repo_full_name/actions/runs/$id" --silent
            fi
          done


      - name: 按保留天数清理工作流
        if: ${{ github.event.inputs.clean_mode == 'date'}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo_full_name=$GITHUB_REPOSITORY
          cutoff_date=$(date -d "${{ github.event.inputs.clean_to_keep }} days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "删除 $cutoff_date 之前的所有工作流..."
          
          # 获取需要删除的工作流ID（--paginate 自动翻页）
          to_delete_ids=$(gh api --paginate -X GET "repos/$repo_full_name/actions/runs?created=<$cutoff_date&per_page=100" | 
            jq -r --arg current_run "$GITHUB_RUN_ID" '[.[].workflow_runs[] | 
            select(.id != ($current_run | tonumber) and .status != "in_progress" and .status != "queued") | .id] | .[]')
          
          for id in $to_delete_ids; do
            echo "删除工作流 $id (创建于 $cutoff_date 之前)"
            gh api -X DELETE "repos/$repo_full_name/actions/runs/$id" --silent
          done
